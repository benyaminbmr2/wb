<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Compare Clans</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    padding:20px;
}

h1{
    text-align:center;
    color:#facc15;
}

.compare-box{
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
    margin:20px 0;
}

select{
    padding:12px;
    border-radius:10px;
    font-size:16px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:#facc15;
    font-weight:bold;
    cursor:pointer;
}

#result{
    margin-top:30px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #334155;
    padding:10px;
    text-align:center;
}

th{
    background:#1e293b;
}

.chart-box{
    margin-top:30px;
}
.compare-wrapper{
    max-width:1200px;
    margin:auto;
}

.vs-header{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:40px;
    margin:40px 0;
}

.clan-side{
    text-align:center;
}

.clan-side img{
    width:120px;
    height:120px;
}

.vs-text{
    font-size:60px;
    font-weight:bold;
    color:#facc15;

    text-shadow:
    0 0 10px #facc15,
    0 0 20px #facc15;
}

.compare-stats{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));

    gap:20px;
    margin-top:30px;
}

.stat-box{
    background:#1e293b;

    padding:20px;

    border-radius:20px;

    border:1px solid #334155;
}

.stat-title{
    color:#facc15;
    font-size:18px;
    margin-bottom:10px;
}

.progress{
    width:100%;
    height:18px;
    background:#334155;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:
    linear-gradient(
        90deg,
        #facc15,
        #f59e0b
    );
}

.compare-table{
    width:100%;
    margin-top:40px;
    border-collapse:collapse;
}

.compare-table th,
.compare-table td{
    padding:15px;
    text-align:center;
    border:1px solid #334155;
}

.compare-table th{
    background:#1e293b;
}

.compare-chart-box{
    margin-top:50px;
    background:#1e293b;
    padding:20px;
    border-radius:20px;
}

.winner-box{
    margin-top:40px;
    text-align:center;

    background:
    linear-gradient(
        135deg,
        #facc15,
        #eab308
    );

    color:black;

    padding:25px;

    border-radius:20px;

    font-size:28px;

    font-weight:bold;
}
.compare-container{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
    margin:30px 0;
}

.compare-select{
    background:linear-gradient(
        135deg,
        #1e293b,
        #334155
    );

    color:white;

    border:2px solid #475569;

    border-radius:15px;

    padding:15px 20px;

    font-size:18px;

    min-width:260px;

    cursor:pointer;

    transition:.3s;

    box-shadow:
        0 0 15px rgba(0,0,0,.3);
}

.compare-select:hover{
    border-color:#facc15;

    box-shadow:
        0 0 20px rgba(250,204,21,.5);
}

.compare-btn{

    background:linear-gradient(
        135deg,
        #3b82f6,
        #2563eb
    );

    color:white;

    border:none;

    border-radius:15px;

    padding:15px 35px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

    box-shadow:
        0 0 20px rgba(59,130,246,.5);
}

.compare-btn:hover{

    transform:translateY(-3px);

    box-shadow:
        0 0 30px rgba(59,130,246,.8);
}

.vs-text{

    font-size:40px;

    font-weight:bold;

    color:#facc15;

    text-shadow:
        0 0 15px gold;
}
.compare-select{
    background:#1e293b;
    color:#fff;
    border:2px solid #facc15;
    border-radius:18px;
    padding:15px 20px;
    font-size:18px;
    font-weight:bold;
    min-width:320px;
}

.compare-select option{
    background:#0f172a;
    color:#fff;
    padding:15px;
    font-size:18px;
}
::-webkit-scrollbar{
    width:16px;
}

::-webkit-scrollbar-track{
    background:#020617;

    border-left:1px solid #1e293b;
}

::-webkit-scrollbar-thumb{

    background:
    linear-gradient(
        180deg,
        #facc15,
        #f59e0b,
        #facc15
    );

    border-radius:50px;

    box-shadow:
        0 0 10px gold,
        0 0 20px gold,
        inset 0 0 10px rgba(255,255,255,.3);
}

::-webkit-scrollbar-thumb:hover{

    transform:scale(1.1);

    box-shadow:
        0 0 15px gold,
        0 0 30px gold,
        0 0 45px gold;
}
.back-btn{
    position:fixed;
    top:20px;
    left:20px;

    background:linear-gradient(
        135deg,
        #3b82f6,
        #2563eb
    );

    color:white;
    text-decoration:none;

    padding:12px 25px;

    border-radius:15px;

    font-size:18px;
    font-weight:bold;

    box-shadow:
        0 0 20px rgba(59,130,246,.5);

    transition:.3s;

    z-index:999;
}

.back-btn:hover{
    transform:translateY(-3px);

    box-shadow:
        0 0 30px rgba(59,130,246,.8);
}
</style>
</head>

<body>
    <a href="index.html" class="back-btn">
    ⬅ Back
</a>

<div class="compare-container">

    <select id="clan1" class="compare-select">
        <option>Select First Clan</option>
    </select>

    <div class="vs-text">⚔️</div>

    <select id="clan2" class="compare-select">
        <option>Select Second Clan</option>
    </select>

    <button
        onclick="compareClans()"
        class="compare-btn"
    >
        Compare
    </button>

</div>
<div id="compareResult"></div>



<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<div id="result"></div>

<div class="chart-box">

    <canvas id="compareChart"></canvas>

</div>

<script src="compare.js"></script>

</body>
</html>
