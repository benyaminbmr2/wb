body {

.profile-container {

.profile-tag {

.stat-box {

.section-title {

.info-list {

.info-item {

.open-player-btn {

    background: linear-gradient(135deg,#22c55e,#15803d);
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
    transition: .3s;
}

.open-player-btn:hover {

.back-btn {
    display: inline-block;
    padding: 13px 22px;
    background: #1e3a5f;
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
}

.loading {
    text-align: center;
    padding: 50px;
    color: #60a5fa;
}

.error {
    text-align: center;
    padding: 40px;
    color: #f87171;
}

@media(max-width:600px) {

    .profile-stats,
    .info-list {
        grid-template-columns: 1fr;
    }

    .profile-card {
        padding: 20px;
    }

}

</style>

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

                break;
            }
