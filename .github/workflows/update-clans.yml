name: Update Clans Data

on:
  schedule:
    # every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: update-clans
  cancel-in-progress: true

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install axios

      - name: Fetch clan data from CoC API
        run: node updateClans.js
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clans.json players.json dailyDonations.json donationHistory.json champions.json
          if git diff --staged --quiet; then
            echo "No data changes detected"
          else
            git commit -m "Auto update clans data"
            git pull --rebase origin main || true
            git push
          fi